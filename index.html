<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbetsschema - Ljust tema</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-slate-800 min-h-screen pb-12">

    <div id="app" class="max-w-4xl mx-auto px-4 pt-8">

        <!-- Header -->
        <header class="bg-white border border-gray-200 rounded-xl p-6 mb-6 shadow-sm">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-6">
                <div>
                    <h1 class="text-xl font-bold text-slate-900">Arbetsschema</h1>
                    <p class="text-slate-500 text-sm">Rullande 28-dagars nattcykel</p>
                    <p class="font-bold text-slate-500 text-sm">Skapad av Johannes Abrahamsson</p>
                </div>
                
                <div class="flex bg-gray-100 p-1 rounded-lg">
                    <button @click="selectedSide = 'gul'" 
                            :class="['px-4 py-2 rounded-md font-semibold text-sm transition', selectedSide === 'gul' ? 'bg-amber-500 text-white shadow' : 'text-slate-600 hover:text-slate-900']">
                        Gul Sida
                    </button>
                    <button @click="selectedSide = 'vit'" 
                            :class="['px-4 py-2 rounded-md font-semibold text-sm transition', selectedSide === 'vit' ? 'bg-blue-600 text-white shadow' : 'text-slate-600 hover:text-slate-900']">
                        Vit Sida
                    </button>
                </div>
            </div>

            <div class="flex flex-wrap items-center gap-2 mt-6 pt-6 border-t border-gray-100">
                <button @click="prevMonth" class="p-2 hover:bg-gray-100 rounded-lg text-slate-600">&larr;</button>
                <select v-model="currentMonth" class="bg-gray-50 text-slate-900 px-3 py-2 rounded-lg border border-gray-200 text-sm font-medium">
                    <option v-for="(name, index) in monthNames" :key="index" :value="index">{{ name }}</option>
                </select>
                <select v-model="currentYear" class="bg-gray-50 text-slate-900 px-3 py-2 rounded-lg border border-gray-200 text-sm font-medium">
                    <option v-for="y in yearOptions" :key="y" :value="y">{{ y }}</option>
                </select>
                <button @click="nextMonth" class="p-2 hover:bg-gray-100 rounded-lg text-slate-600">&rarr;</button>
                <button @click="goToToday" class="ml-auto px-4 py-2 bg-white border border-gray-200 hover:bg-gray-50 text-slate-700 text-sm font-medium rounded-lg shadow-sm">Idag</button>
            </div>
        </header>

        <!-- Stats & Copy -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-white border border-gray-200 p-4 rounded-xl shadow-sm flex items-center justify-between">
                <span class="text-slate-500 text-sm font-medium">Arbetspass</span>
                <span class="text-xl font-bold text-slate-900">{{ monthStats.workDays }}</span>
            </div>
            <div class="bg-white border border-gray-200 p-4 rounded-xl shadow-sm flex items-center justify-between">
                <span class="text-slate-500 text-sm font-medium">Lediga dagar</span>
                <span class="text-xl font-bold text-slate-900">{{ monthStats.offDays }}</span>
            </div>
            <div class="bg-white border border-gray-200 p-4 rounded-xl shadow-sm flex flex-col gap-2">
                <div class="flex bg-gray-100 p-1 rounded-lg">
                    <button @click="copyType = 'offDays'" :class="['flex-1 py-1 text-xs font-semibold rounded-md transition', copyType === 'offDays' ? 'bg-white shadow text-slate-900' : 'text-slate-500']">Ledigt</button>
                    <button @click="copyType = 'workDays'" :class="['flex-1 py-1 text-xs font-semibold rounded-md transition', copyType === 'workDays' ? 'bg-white shadow text-slate-900' : 'text-slate-500']">Pass</button>
                </div>
                <button @click="copyToClipboard" class="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg text-sm transition">
                    {{ copySuccess ? '✓ Kopierat!' : 'Kopiera' }}
                </button>
            </div>
        </div>

        <!-- Calendar Grid -->
        <div class="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden">
            <div class="grid grid-cols-7 border-b border-gray-200 bg-gray-50">
                <div v-for="day in weekDays" :key="day" class="py-3 text-center text-xs font-bold text-slate-500 uppercase tracking-wider">{{ day }}</div>
            </div>

            <div class="grid grid-cols-7">
                <div v-for="item in calendarDays" :key="item.id" class="min-h-[100px] border-b border-r border-gray-100 p-2 transition-colors hover:bg-gray-50 relative" :class="{'bg-gray-50/50': item.isPadding}">
                    <template v-if="!item.isPadding">
                        <span :class="['text-xs font-bold', item.isSunday ? 'text-red-500' : 'text-slate-700', item.isToday ? 'bg-blue-600 text-white w-6 h-6 flex items-center justify-center rounded-full' : '']">
                            {{ item.dayNumber }}
                        </span>
                        
                        <div v-if="item.isWork" class="mt-2">
                            <div :class="['rounded-md p-1.5 text-[10px] font-bold text-white shadow-sm', selectedSide === 'gul' ? 'bg-amber-500' : 'bg-blue-500']">
                                <div class="text-[9px] opacity-90 uppercase">Pass</div>
                                <div class="mt-0.5 font-mono">{{ item.shiftTime }}</div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, computed } = Vue;

        createApp({
            setup() {
                const today = new Date();
                const currentYear = ref(today.getFullYear());
                const currentMonth = ref(today.getMonth());
                const selectedSide = ref('gul'); 
                const copyType = ref('offDays'); 
                
                const monthNames = ['Januari', 'Februari', 'Mars', 'April', 'Maj', 'Juni', 'Juli', 'Augusti', 'September', 'Oktober', 'November', 'December'];
                const weekDays = ['Mån', 'Tis', 'Ons', 'Tor', 'Fre', 'Lör', 'Sön'];
                
                // 50 år
                const yearOptions = computed(() => Array.from({length: 50}, (_, i) => 2025 + i));

                const prevMonth = () => { currentMonth.value === 0 ? (currentMonth.value = 11, currentYear.value--) : currentMonth.value--; };
                const nextMonth = () => { currentMonth.value === 11 ? (currentMonth.value = 0, currentYear.value++) : currentMonth.value++; };
                const goToToday = () => { currentYear.value = today.getFullYear(); currentMonth.value = today.getMonth(); };

                const getShiftTime = (date) => {
                    // 0=Sön, 1=Mån ... 5=Fre, 6=Lör
                    const d = date.getDay();
                    return (d === 5 || d === 6) ? "20:00-06:00" : "19:00-05:00";
                };

                const isWorkDay = (date) => {
                    const anchor = new Date(2026, 0, 7);
                    const diffDays = Math.round((new Date(date.getFullYear(), date.getMonth(), date.getDate()) - anchor) / (1000 * 60 * 60 * 24));
                    const cycleIndex = ((diffDays % 28) + 28) % 28;
                    const isWorkOriginal = (cycleIndex >= 0 && cycleIndex <= 4) || (cycleIndex >= 9 && cycleIndex <= 13) || (cycleIndex >= 19 && cycleIndex <= 22);
                    return selectedSide.value === 'gul' ? !isWorkOriginal : isWorkOriginal;
                };

                const calendarDays = computed(() => {
                    const year = currentYear.value, month = currentMonth.value;
                    const firstDay = new Date(year, month, 1).getDay();
                    const padding = firstDay === 0 ? 6 : firstDay - 1;
                    const days = Array.from({length: padding}, (_, i) => ({ id: `pad-${i}`, isPadding: true }));
                    
                    const lastDate = new Date(year, month + 1, 0).getDate();
                    for (let d = 1; d <= lastDate; d++) {
                        const date = new Date(year, month, d);
                        days.push({ 
                            id: `day-${d}`, 
                            dayNumber: d, 
                            isWork: isWorkDay(date), 
                            isToday: date.toDateString() === today.toDateString(), 
                            isSunday: date.getDay() === 0,
                            shiftTime: getShiftTime(date),
                            isPadding: false 
                        });
                    }
                    return days;
                });

                const monthStats = computed(() => {
                    const workDays = calendarDays.value.filter(d => !d.isPadding && d.isWork).length;
                    return { workDays, offDays: calendarDays.value.filter(d => !d.isPadding).length - workDays };
                });

                const formattedText = computed(() => {
                    let blocks = [], currentBlock = [];
                    const isOffDays = copyType.value === 'offDays';
                    
                    calendarDays.value.filter(d => !d.isPadding).forEach(d => {
                        const matches = isOffDays ? !d.isWork : d.isWork;
                        if (matches) currentBlock.push(String(d.dayNumber).padStart(2, '0'));
                        else if (currentBlock.length > 0) { blocks.push(currentBlock.join(' ')); currentBlock = []; }
                    });
                    if (currentBlock.length > 0) blocks.push(currentBlock.join(' '));

                    const header = isOffDays 
                        ? `Hejsan, här är mina tillgängliga dagar vid ${monthNames[currentMonth.value].toLowerCase()}.\n\n`
                        : `Arbetspass ${monthNames[currentMonth.value].toLowerCase()}\n\n`;

                    return header + blocks.join('  \n');
                });

                const copySuccess = ref(false);
                const copyToClipboard = () => {
                    navigator.clipboard.writeText(formattedText.value).then(() => {
                        copySuccess.value = true;
                        setTimeout(() => copySuccess.value = false, 2500);
                    });
                };

                return { currentYear, currentMonth, selectedSide, copyType, monthNames, weekDays, yearOptions, calendarDays, monthStats, prevMonth, nextMonth, goToToday, copyToClipboard, copySuccess };
            }
        }).mount('#app');
    </script>
</body>
</html>
